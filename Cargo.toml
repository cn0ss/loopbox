[package]
name = "loopbox"
version = "0.3.5"
authors = ["Niklas Schmidt <niklas@niklasschmidt.dev>"]
homepage = "https://loopbox.tech/"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.9", features = ["router"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
webbrowser = "1.0"
serde_json = "1.0"
arboard = "3.4"
rmcp = { version = "1.6.0", features = ["server", "schemars", "transport-io", "elicitation"] }
schemars = { version = "1.2.1", features = ["derive"] }
tokio = { version = "1.48.0", features = ["time", "rt-multi-thread", "net"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "blocking"] }
axum = "0.8.6"
h2 = "0.4.13"
bytes = "1.11.1"
libc = "0.2"
rustix = { version = "1.1.3", features = ["fs", "process", "stdio", "termios", "pty"] }
getrandom = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
libghostty-vt = { version = "=0.1.1", optional = true }
libghostty-vt-sys = { version = "=0.1.1", optional = true }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
ghostty-vt = ["dep:libghostty-vt", "dep:libghostty-vt-sys"]

[build-dependencies]
cc = "1.2"

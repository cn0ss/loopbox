name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos-core:
    name: macOS core gate
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup show

      - name: Zig
        run: |
          brew install zig@0.15
          prefix="$(brew --prefix zig@0.15)"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/zig" version

      - name: Format
        run: cargo fmt -- --check

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build

      - name: Agent API smoke
        run: scripts/smoke-agent-api-workflow.sh --no-auto-build

  windows-core:
    name: Windows compile and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup show

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build
